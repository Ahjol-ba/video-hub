<link rel="stylesheet" href="/static/css/common.css" />
<link rel="stylesheet" href="/static/css/pagination.css" />
<div class="page-bar-wrapper">
    <div class="page-bar">
        {% if total > 0 %} {% if has_prev %}
        <button class="btn btn-page" page="{{current_page - 1}}" onclick="jumpPage(event)">&laquo; Prev</button>
        {% else %}
        <button class="btn btn-page" page="{{current_page - 1}}" disabled="">&laquo; Prev</button>
        {% endif %} {% for p in iter_pages %} {% if p %} {% if p == current_page %}
        <button class="btn btn-page selected" page="{{p}}">{{ p }}</button>
        {% else %}
        <button class="btn btn-page" page="{{p}}" onclick="jumpPage(event)">{{ p }}</button>
        {% endif %} {% else %}
        <span>&hellip;</span>
        {% endif %} {% endfor %} {% if has_next %}
        <button class="btn btn-page" page="{{current_page + 1}}" onclick="jumpPage(event)">Next &raquo;</button>
        {% else %}
        <button class="btn btn-page" page="{{current_page + 1}}" disabled="">Next &raquo;</button>
        {% endif %} {% endif %}
    </div>
</div>
<script src="/static/js/pagination.js"></script>
